<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modbus 配置管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2026051202">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <strong>Modbus</strong>
          <small>配置管理</small>
        </div>
      </div>
      <nav class="nav-tabs" aria-label="资源类型">
        <button class="nav-tab active" data-tab="locators">寄存器定位</button>
        <button class="nav-tab" data-tab="templates">寄存器模板</button>
        <button class="nav-tab" data-tab="devices">Modbus 设备</button>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">寄存器定位</h1>
          <p id="pageHint">维护 RegisterLocator，并供模板批量关联。</p>
        </div>
        <div class="status-line" id="statusLine">就绪</div>
      </header>

      <section class="panel active" id="locatorsPanel">
        <div class="toolbar">
          <div class="query-box">
            <input id="locatorQueryId" type="number" min="1" placeholder="按 ID 查询">
            <button data-action="find-locator">查询</button>
          </div>
          <div class="toolbar-actions">
            <button data-action="refresh-locators">刷新</button>
            <button class="primary" data-action="new-locator">新增定位</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>标签</th>
                <th>类型</th>
                <th>从站</th>
                <th>范围</th>
                <th>偏移</th>
                <th>数据类型</th>
                <th>位</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="locatorsTable"></tbody>
          </table>
        </div>
        <div class="pager" id="locatorsPager"></div>
      </section>

      <section class="panel" id="templatesPanel">
        <div class="toolbar">
          <div class="query-box">
            <input id="templateQueryId" type="number" min="1" placeholder="按 ID 查询">
            <button data-action="find-template">查询</button>
          </div>
          <div class="toolbar-actions">
            <button data-action="refresh-templates">刷新</button>
            <button class="primary" data-action="new-template">新增模板</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>标签</th>
                <th>版本</th>
                <th>定位器</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="templatesTable"></tbody>
          </table>
        </div>
        <div class="pager" id="templatesPager"></div>
      </section>

      <section class="panel" id="devicesPanel">
        <div class="toolbar">
          <div class="query-box">
            <input id="deviceQueryId" type="number" min="1" placeholder="按 ID 查询">
            <button data-action="find-device">查询</button>
          </div>
          <div class="toolbar-actions">
            <button data-action="refresh-devices">刷新</button>
            <button class="primary" data-action="new-device">新增设备</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>标签</th>
                <th>地址</th>
                <th>在线状态</th>
                <th>仅变化上报</th>
                <th>采集间隔（秒）</th>
                <th>模板</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="devicesTable"></tbody>
          </table>
        </div>
        <div class="pager" id="devicesPager"></div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="entityModal" tabindex="-1" aria-labelledby="dialogTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="dialogTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body p-0">
          <form id="entityForm"></form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js?v=2026051401"></script>
</body>
</html>
